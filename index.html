<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArnTo Decor Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=4">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L13.09 8.26L19 6L15.45 11.09L22 12L15.45 12.91L19 18L13.09 15.74L12 22L10.91 15.74L5 18L8.55 12.91L2 12L8.55 11.09L5 6L10.91 8.26L12 2Z" fill="currentColor"/>
                </svg>
                <span class="logo-text">ArnTo <span class="logo-accent">Decor</span></span>
            </div>
            <div class="search-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm decor...">
            </div>
            <div id="totalCount" class="total-count">-- items</div>
        </div>
    </header>

    <div class="filter-bar">
        <div class="container filter-inner">
            <button class="filter-btn active" data-type="all">Tất cả</button>
            <button class="filter-btn" data-type="0">
                <span class="filter-dot dot-avatar"></span>Avatar Deco
            </button>
            <button class="filter-btn" data-type="1">
                <span class="filter-dot dot-profile"></span>Profile Effect
            </button>
            <button class="filter-btn" data-type="2">
                <span class="filter-dot dot-nameplate"></span>Nameplate
            </button>
            <button class="filter-btn" data-type="3">
                <span class="filter-dot dot-frame"></span>Frame
            </button>
            <button class="filter-btn" data-type="1000">
                <span class="filter-dot dot-bundle"></span>Bundle
            </button>
        </div>
    </div>

    <main class="main container">
        <div id="loadingState" class="state-wrap">
            <div class="spinner"></div>
            <p class="state-text">Đang tải dữ liệu từ bot...</p>
        </div>

        <div id="errorState" class="state-wrap hidden">
            <div class="state-icon">⚠</div>
            <p class="state-text">Không thể kết nối đến bot.</p>
            <p class="state-sub">Hãy đảm bảo ArnTo-assistant đang chạy và <code>EXPRESS=true</code> trong .env</p>
            <button onclick="location.reload()" class="retry-btn">Thử lại</button>
        </div>

        <div id="emptyState" class="state-wrap hidden">
            <div class="state-icon">✦</div>
            <p class="state-text">Không tìm thấy decor nào.</p>
        </div>

        <div id="grid" class="grid hidden"></div>
        <div id="pagination" class="pagination hidden"></div>
    </main>

    <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
        <div class="modal-box">
            <button id="modalClose" class="modal-close" aria-label="Đóng">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
                    <path d="M18 6 6 18M6 6l12 12"/>
                </svg>
            </button>
            <div id="modalContent" class="modal-content"></div>
        </div>
    </div>

    <script src="assets/js/api.js?v=4"></script>
    <script src="assets/js/app.js?v=4"></script>
</body>
</html>
